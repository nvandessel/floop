# GoReleaser configuration for floop
# Documentation: https://goreleaser.com
#
# Builds are pre-built by auto-release.yml (native CGO builds on each platform).
# goreleaser runs in pre-built binary mode: packaging, checksums, changelog, homebrew.

version: 2

builds:
  - id: floop
    builder: prebuilt
    prebuilt:
      path: "dist/floop_{{ .Os }}_{{ .Arch }}{{ with .Amd64 }}_{{ . }}{{ end }}/floop{{ .Ext }}"
    binary: floop
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    name_template: "{{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - docs/**/*

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Documentation
      regexp: '^.*?docs(\(.+\))??!?:.+$'
      order: 2
    - title: Other Changes
      order: 999
  filters:
    exclude:
      - '^chore:'
      - '^ci:'
      - '^build:'
      - '^test:'
      - 'merge conflict'
      - Merge pull request
      - Merge remote-tracking branch
      - Merge branch

release:
  github:
    owner: nvandessel
    name: floop
  draft: false
  prerelease: auto
  mode: replace
  header: |
    ## floop {{ .Tag }}

    Release artifacts for version {{ .Tag }}.
  footer: |
    ## Installation

    ### Homebrew (macOS/Linux)
    ```
    brew install nvandessel/tap/floop
    ```

    ### Manual
    Download the appropriate archive for your platform below, extract it, and move the `floop` binary to your PATH.

    ### Building from source
    See [docs/EMBEDDINGS.md](https://github.com/nvandessel/floop/blob/main/docs/EMBEDDINGS.md#building-from-source) for instructions on building with LanceDB support.

    **Full changelog**: https://github.com/nvandessel/floop/compare/{{ .PreviousTag }}...{{ .Tag }}

homebrew_casks:
  - repository:
      owner: nvandessel
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/nvandessel/floop
    description: "Behavior learning for AI agents"
    license: Apache-2.0
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/floop"]
          end

# Disable features we're not using yet
dockers: []
nfpms: []
